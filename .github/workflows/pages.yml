name: Build and publish GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: /dragonschatz-spa/
      - name: Check GitHub Pages asset paths
        run: |
          grep -q '/dragonschatz-spa/assets/' dist/index.html
          test -f dist/images/hero.jpg
          test -f dist/menus/mittag.pdf
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && vars.ENABLE_GH_PAGES == 'true'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && vars.ENABLE_GH_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
